{{ define "main" }}

<style>
    /* Estilos do custom.css para o banner, busca, botões e filtro de ano */

    /* Definir as variáveis de cor do PaperMod para este contexto */
    :root {
        --primary: #0E478C;    /* Azul escuro do Acervo Jamildo.com */
        --secondary: #FF5722; /* Laranja do Acervo Jamildo.com */
        --tertiary: #FF5722;   /* Laranja para o botão default */
        --content: #333;       /* Cor do texto de conteúdo */
        --background: #f8f2e7; /* Fundo geral do site (só para garantir que não tem branco do tema atrapalhando) */
        --card-background: #ffffff; /* Fundo dos cartões de post */
        --border-color: #ddd; /* Cor das bordas */
    }

    /* Estilos para a seção principal do banner (home-info-section) */
    .main-content-wrapper .home-info-section {
        background-color: var(--primary) !important; /* Força o azul no banner */
        color: #fff !important; /* Texto branco no banner */
        padding: 80px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 400px;
    }

    .main-content-wrapper .home-info-section .section-title {
        font-size: 2.8em;
        margin-bottom: 15px;
        color: #fff !important; /* Força o título branco */
        font-weight: 700;
    }

    .main-content-wrapper .home-info-section .section-subtitle {
        font-size: 1.2em;
        margin-bottom: 30px;
        max-width: 700px;
        line-height: 1.5;
    }

    /* Estilos para os botões do banner */
    .main-content-wrapper .home-info-section .home-buttons {
        margin-top: 20px;
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    /* Sobrescrevendo o estilo do botão existente para o laranja com alta especificidade */
    .main-content-wrapper .home-info-section .home-buttons .button {
        background-color: var(--secondary) !important; /* Laranja */
        border: 2px solid var(--secondary) !important; /* Borda laranja */
        color: #fff !important; /* Texto branco */
        padding: 12px 25px !important; /* Garante padding */
        text-decoration: none !important; /* Sem sublinhado */
        border-radius: 5px !important; /* Borda arredondada */
        font-weight: 600 !important; /* Negrito */
        transition: background-color 0.3s ease !important;
    }

    .main-content-wrapper .home-info-section .home-buttons .button:hover {
        background-color: #E64A19 !important; /* Laranja mais escuro no hover */
        cursor: pointer;
    }

    /* Estilos para o container da busca */
    .main-content-wrapper .home-info-section .search-bar-container {
        display: flex;
        margin-top: 30px;
        width: 100%;
        max-width: 500px;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .main-content-wrapper .home-info-section .search-bar-container input[type="text"] {
        flex-grow: 1;
        padding: 12px 20px;
        border: none;
        outline: none;
        font-size: 1.1em;
        background-color: #fff;
        color: var(--content);
    }

    .main-content-wrapper .home-info-section .search-bar-container button {
        background-color: var(--primary) !important; /* Azul */
        color: #fff !important; /* Texto branco */
        border: none;
        padding: 12px 18px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .main-content-wrapper .home-info-section .search-bar-container button:hover {
        background-color: #0A3A6E !important; /* Azul mais escuro no hover */
    }

    .main-content-wrapper .home-info-section .search-bar-container button svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
    }

    /* Estilos para o filtro de ano (dropdown) */
    .main-content-wrapper .home-info-section .year-filter-container {
        margin-top: 25px;
        color: #fff !important; /* Texto branco */
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .main-content-wrapper .home-info-section .year-filter-container label {
        font-size: 1em;
        font-weight: 500;
    }

    .main-content-wrapper .home-info-section .year-filter-container select {
        padding: 8px 12px;
        border-radius: 5px;
        border: 1px solid var(--border-color);
        background-color: #fff;
        color: var(--content) !important; /* Texto das opções em cor de conteúdo (escuro) */
        font-size: 1em;
        cursor: pointer;
        outline: none;
    }

    .main-content-wrapper .home-info-section .year-filter-container select:focus {
        border-color: var(--secondary) !important; /* Borda laranja ao focar */
    }
    /* Estilos para o container dos GIFs */
    .gif-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        padding: 30px 0 15px 0;
        width: 100%;
        max-width: 1000px; /* Mantém a largura máxima do container em 1000px */
        margin: 20px auto;
        /* background-color: #f8f2e7; */ /* Transparente */
        /* border-radius: 8px; */
        /* box-shadow: 0 2px 5px rgba(0,0,0,0.1); */
        align-items: center;
    }

    .gif-container img {
        width: 450px !important; /* <--- NOVO: Força a largura para 450px (TESTE!) */
        height: auto !important; /* <--- NOVO: Garante que a altura se ajuste proporcionalmente */
        max-width: 100% !important; /* <--- NOVO: Garante que não exceda a largura do pai */
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    /* Estilos responsivos para telas menores (celulares/tablets) */
    @media (max-width: 768px) {
        .gif-container {
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px 0 10px 0;
            margin: 15px auto;
        }
        .gif-container img {
            width: 90% !important; /* <--- NOVO: Força a largura para 90% em celular */
            max-width: 350px !important; /* <--- NOVO: Ajusta o max-width para telas menores, se ainda pequeno */
        }
    }
</style>

<div class="main-content-wrapper">
    <div class="home-info-section">
        <h1 class="section-title">{{ site.Params.homeInfoParams.Title }}</h1>
        <p class="section-subtitle">{{ site.Params.homeInfoParams.Content }}</p>

        <div class="home-buttons">
            <a class="button" href="{{ "/archives/" | absLangURL }}">Explorar por Ano</a>
        </div>

        <div class="search-bar-container">
            <input type="text" id="searchInput" placeholder="Buscar no acervo..." aria-label="Buscar no acervo">
            <button id="searchButton" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>

        <div class="year-filter-container">
            <label for="yearFilterSelect">Filtrar:</label>
            <select id="yearFilterSelect" class="year-select">
                <option value="all">Todos os Anos</option>
                <option value="2006">2006</option>
                <option value="2007">2007</option>
                <option value="2008">2008</option>
                <option value="2009">2009</option>
                <option value="2010">2010</option>
                <option value="2011">2011</option>
                <option value="2012">2012</option>
                <option value="2013">2013</option>
                <option value="2014">2014</option>
                <option value="2015">2015</option>
                <option value="2016">2016</option>
                <option value="2017">2017</option>
                <option value="2018">2018</option>
                <option value="2019">2019</option>
                <option value="2020">2020</option>
                <option value="2021">2021</option>
                <option value="2022">2022</option>
                <option value="2023">2023</option>
                <option value="2024">2024</option>
            </select>
        </div>
    </div>
</div>
<div class="gif-container">
    <a href="https://www.jamildo.com" target="_blank" rel="noopener noreferrer">
        <img src="{{ "gifs/acessejamildo.gif" | absURL }}" alt="Acompanhe nosso conteúdo atual no Jamildo.com">
    </a>
    <a href="https://www.youtube.com/@jamildomelooficial?sub_confirmation=1" target="_blank" rel="noopener noreferrer">
        <img src="{{ "gifs/youtubejamildo.gif" | absURL }}" alt="Acesse nosso canal do Youtube">
    </a>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const yearFilterSelect = document.getElementById('yearFilterSelect'); // <-- Obtenha a referência ao seu select de ano

        function performSearch() {
            const query = searchInput.value.trim();
            const selectedYear = yearFilterSelect.value; // <-- Pega o ano selecionado no dropdown

            let searchURL = `{{ "/search/" | absLangURL }}`;
            
            // Adiciona o parâmetro de ano à URL SE um ano específico estiver selecionado
            if (selectedYear && selectedYear !== 'all') {
                searchURL += `?year=${selectedYear}`; 
            }

            // Adiciona a query de busca como hash (após o parâmetro de ano, se houver)
            if (query) {
                // Se já houver um parâmetro de query (o ano), adiciona o hash depois.
                // Caso contrário, adiciona o hash diretamente.
                searchURL += `#${encodeURIComponent(query)}`;
            }
            
            window.location.href = searchURL;
        }

        if (searchButton) {
            searchButton.addEventListener('click', performSearch);
        }

        if (searchInput) {
            searchInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    performSearch();
                }
            });
        }

        // Listener para o dropdown de ano: quando o valor muda, a busca é disparada
        if (yearFilterSelect) {
            yearFilterSelect.addEventListener('change', function() {
                performSearch(); // Dispara a busca com o ano selecionado e a query atual (se houver)
            });
        }
    });
</script>

{{ end }}
